<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Profile</title>
</head>
<body>
    <div class="container">
        <nav class="menu">
            <ul class="menu__list">
                <li class="menu__list-item">
                    <a href="" class="menu__list-link">
                        <img class="menu__list-img" src="/images/icons/home.png" alt="home" width="24">
                    </a>
                </li>
                <li class="menu__list-item">
                    <a href="" class="menu__list-link">
                        <img class="menu__list-img" src="/images/icons/user.png" alt="user" width="24">
                    </a>
                </li>
                <li class="menu__list-item">
                    <a href="" class="menu__list-link">
                        <img class="menu__list-img" src="/images/icons/plus.png" alt="plus" width="24">
                    </a>
                </li>
            </ul>
        </nav>

        <div class="profilecontainer">
            <div class="profilecontainer__about">
                <img class="profilecontainer__about-ava" src="/images/ava.png" alt="man" width="123">
                <div class="profilecontainer__about-info info">
                    <p class="info__name">Ваня Денисов</p>
                    <p class="info__main">Привет! Я системный аналитик в ACME :) Тут моя жизнь только для самых классных!</p>
                </div>
                <div class="profilecontainer__about-posts aboutpost" >
                    <img class="aboutpost__img" src="/images/icons/image.png" alt="image" width="16">
                    <p class="aboutpost__count">43 поста</p>
                </div>
            </div>
            <div class="profilecontainer__posts">
                <div class="profilecontainer__posts-item post">
                    <a href="" class="post__link">
                        <img class="profilecontainer__posts-img" src="/images/img_post/city.png" alt="city" width="150">
                    </a>
                </div> 
                <div class="profilecontainer__posts-item post">
                    <a href="" class="post__link">
                        <img class="profilecontainer__posts-img" src="/images/img_post/town.png" alt="town" width="150">
                    </a>
                </div> 
                <div class="profilecontainer__posts-item post">
                    <a href="" class="post__link">
                        <img class="profilecontainer__posts-img" src="/images/img_post/people.png" alt="people" width="150">
                    </a>
                </div> 
                <div class="profilecontainer__posts-item post">
                    <a href="" class="post__link">
                        <img class="profilecontainer__posts-img" src="/images/img_post/fish.png" alt="fish" width="150">
                    </a>
                </div>
                <div class="profilecontainer__posts-item post">
                    <a href="" class="post__link">
                        <img class="profilecontainer__posts-img" src="/images/img_post/book.png" alt="fish" width="150">
                    </a>
                </div>
                <div class="profilecontainer__posts-item post">
                    <a href="" class="post__link">
                        <img class="profilecontainer__posts-img" src="/images/img_post/cake.png" alt="fish" width="150">
                    </a>
                </div>      
            </div>
        </div>
    </div>   
</body>
</html>
