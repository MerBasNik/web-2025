<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <section>
        <div>
            <h1>Войти</h1>
        </div>
        <img src="/lw4/images/login.jpg" alt="login" style="max-width: 150px;">
        <div> 
            <form>
                <label for="email">Электропочта</label>
                <input type="email" name="email" id="email" placeholder="Введите электропочту в формате ****@******" required>
                <label for="password">Пароль</label>
                <input type="password" name="password" id="password" required>
                <button type="submit">Продолжить</button>
            </form>
        </div>
    </section>
</body>
</html>
