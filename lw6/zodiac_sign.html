<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Определение знака зодиака</title>
</head>
<body>
    <h1>Определение знака зодиака</h1>
    <form action="3.php" method="post">
        <label for="date">Введите дату рождения в формате ДД.ММ.ГГГГ:</label>
        <input type="text" id="date" name="date" pattern="\d{2}\.\d{2}\.\d{4}" required>
        <button type="submit">Определить знак зодиака</button>
    </form>
